name: Segurança

# Auditoria de segurança a cada push/PR para a main e semanalmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ o gitleaks varrer commits antigos
      # A gitleaks-action@v2 passou a exigir LICENÇA em repositório de organização (o repo
      # vive na Juan3403) e derrubava este job em todo push. O binário oficial é open
      # source e não exige nada — versão FIXADA de propósito (supply chain). Falsos positivos
      # conferidos (chaves de teste em e2e/test) levam o comentário "gitleaks:allow" na própria linha.
      - name: Gitleaks (binário oficial; redigido — falha o pipeline se achar segredo)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  scanner-interno:
    name: Scanner interno (fallback sem dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan de segredos (Node, saída redigida)
        run: node scripts/scan-secrets.js

  dependencias:
    name: Auditoria de dependências + lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instala dependências a partir do lockfile (falha se o lockfile divergir)
        run: npm ci
      - name: Confere se o package-lock está em dia
        run: |
          if [ ! -f package-lock.json ]; then echo "package-lock.json ausente"; exit 1; fi
          git diff --exit-code package-lock.json || (echo "package-lock.json mudou após npm ci"; exit 1)
      - name: npm audit (falha em vulnerabilidade alta/crítica)
        run: npm audit --audit-level=high

  testes:
    name: Testes de segurança e fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
