<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Gestão RM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Padrão 404-simple: eyebrow da marca, display forte, apoio cinza, dois botões.
     Cores: cópia literal de design-system/01-tokens.css + 02-themes.css (a página
     não carrega o DS; ver docs/DESIGN.md §11.4). */
  * { box-sizing: border-box; }
  :root {
    --bg: #f3f5f2; --ink: #17211b; --muted: #5c685f; --line: #d4dad5;
    --line-strong: #808d85; /* borda de CONTROLE: a divisória reprova WCAG 1.4.11 como limite */
    --brand: #31363e; --brand-hover: #4a5058; --on-brand: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --ink: #e8eaed; --muted: #a6acb3; --line: #282c32;
      --line-strong: #6e7780;
      --brand: #bfc4ca; --brand-hover: #d5d9dd; --on-brand: #0e1013;
    }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  main { max-width: 640px; text-align: left; }
  .eyebrow { color: var(--muted); font-weight: 600; font-size: 14px; margin: 0 0 12px; }
  h1 { font-size: clamp(36px, 7vw, 60px); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin: 0 0 20px; }
  p { font-size: clamp(16px, 2.2vw, 20px); line-height: 1.5; color: var(--muted); margin: 0 0 40px; }
  .acoes { display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    font-weight: 600; font-size: 16px; padding: 12px 18px; border-radius: 4px;
    border: 1px solid transparent; transition: background .1s ease;
  }
  /* `a.btn-sec`/`a.btn-pri` e não `.btn-sec`: o `a.btn` acima tem especificidade maior
     (elemento + classe) e o `border: ... transparent` dele venceria um `border-color`
     de classe só — a borda do "Voltar" simplesmente não apareceria. */
  a.btn-sec { color: var(--ink); border-color: var(--line-strong); }
  a.btn-sec:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  a.btn-pri { background: var(--brand); color: var(--on-brand); }
  a.btn-pri:hover { background: var(--brand-hover); }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p>Desculpe, a página que você procura não existe ou foi movida.<br>Confira o endereço ou volte para o painel.</p>
    <div class="acoes">
      <a class="btn btn-sec" href="javascript:history.back()">&larr; Voltar</a>
      <a class="btn btn-pri" href="/painel">Ir para o painel</a>
    </div>
  </main>
</body>
</html>
